spring.application.name=cdci
spring.datasource.url=${CDCI_DATABASE_URL:jdbc:postgresql://localhost:5432/cdci}
spring.datasource.username=${CDCI_DATABASE_USERNAME:cdci}
spring.datasource.password=${CDCI_DATABASE_PASSWORD:cdci_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 * * * * *
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CDCI_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${CDCI_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.name=CDCI_SESSION
cdci.frontend-origin=${CDCI_FRONTEND_ORIGIN:http://localhost:3000}
cdci.registration-enabled=${CDCI_REGISTRATION_ENABLED:false}
cdci.email.enabled=${CDCI_EMAIL_ENABLED:false}
cdci.email.from=${CDCI_EMAIL_FROM:no-reply@cdci.local}
cdci.identity.email-verification-required=${CDCI_EMAIL_VERIFICATION_REQUIRED:false}
cdci.identity.password-reset-ttl-minutes=${CDCI_PASSWORD_RESET_TTL_MINUTES:20}
cdci.identity.rate-limit-hmac-key=${CDCI_IDENTITY_RATE_LIMIT_HMAC_KEY:}
spring.mail.host=${CDCI_SMTP_HOST:localhost}
spring.mail.port=${CDCI_SMTP_PORT:1025}
spring.mail.username=${CDCI_SMTP_USERNAME:}
spring.mail.password=${CDCI_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CDCI_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${CDCI_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${CDCI_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=cdci-mail-
cdci.bootstrap-admin-email=${CDCI_BOOTSTRAP_ADMIN_EMAIL:}
cdci.bootstrap-admin-password=${CDCI_BOOTSTRAP_ADMIN_PASSWORD:}
cdci.github.client-id=${CDCI_GITHUB_CLIENT_ID:}
cdci.github.client-secret=${CDCI_GITHUB_CLIENT_SECRET:}
cdci.github.callback-url=${CDCI_GITHUB_CALLBACK_URL:http://localhost:8080/api/integrations/github/callback}
cdci.github.frontend-url=${CDCI_FRONTEND_ORIGIN:http://localhost:3000}
cdci.github.token-encryption-key=${CDCI_GITHUB_TOKEN_ENCRYPTION_KEY:}
cdci.secret.encryption-key=${CDCI_SECRET_ENCRYPTION_KEY:}
cdci.runner.token=${CDCI_RUNNER_TOKEN:}
cdci.runner.retention-days=${CDCI_RUN_RETENTION_DAYS:90}
cdci.audit.retention-days=${CDCI_AUDIT_RETENTION_DAYS:365}
cdci.audit.retention-interval-ms=${CDCI_AUDIT_RETENTION_INTERVAL_MS:86400000}
