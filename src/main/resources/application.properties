spring.application.name=cdci
spring.datasource.url=${CDCI_DATABASE_URL:jdbc:postgresql://localhost:5432/cdci}
spring.datasource.username=${CDCI_DATABASE_USERNAME:cdci}
spring.datasource.password=${CDCI_DATABASE_PASSWORD:cdci_dev_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.cleanup-cron=0 * * * * *
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${CDCI_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${CDCI_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.name=CDCI_SESSION
cdci.frontend-origin=${CDCI_FRONTEND_ORIGIN:http://localhost:3000}
cdci.registration-enabled=${CDCI_REGISTRATION_ENABLED:true}
cdci.bootstrap-admin-email=${CDCI_BOOTSTRAP_ADMIN_EMAIL:}
cdci.bootstrap-admin-password=${CDCI_BOOTSTRAP_ADMIN_PASSWORD:}
